name: Fork Release

# Runs on every push to the protected `master` (i.e. a merged update). Builds the
# firmware and publishes it as a GitHub Release tagged for the CrossPoint release
# the branch sits on: `todo-<crosspoint-tag>` (for example `todo-2.0.0`). Re-runs
# replace the assets on the existing release.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0          # tags are needed to find the base release

      - name: Determine CrossPoint release tag
        id: base
        run: |
          set -euo pipefail
          # Nearest non-fork tag reachable from HEAD is the CrossPoint release
          # the feature commits sit on.
          base="$(git describe --tags --abbrev=0 --exclude 'todo-*')"
          echo "tag=${base}" >> "$GITHUB_OUTPUT"
          echo "release=todo-${base}" >> "$GITHUB_OUTPUT"
          echo "CrossPoint base: ${base} -> release tag todo-${base}"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-fork-${{ runner.os }}-release-${{ hashFiles('platformio.ini', 'scripts/patch_pioarduino_cache.py') }}
          restore-keys: pio-fork-${{ runner.os }}-release-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          pio pkg install -e default
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build default firmware
        run: pio run -e default

      - name: Prepare assets
        env:
          BASE: ${{ steps.base.outputs.tag }}
        run: |
          set -euo pipefail
          cp .pio/build/default/firmware.factory.bin "todopoint-${BASE}-x3-x4.factory.bin"
          cp .pio/build/default/firmware.bin "todopoint-${BASE}-x3-x4.bin"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.base.outputs.tag }}
          TAG: ${{ steps.base.outputs.release }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" todopoint-*.bin --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" todopoint-*.bin \
              --repo "$GITHUB_REPOSITORY" \
              --title "To-do fork on CrossPoint ${BASE}" \
              --notes "Built from \`master\` (${GITHUB_SHA}) on CrossPoint ${BASE}."
          fi
